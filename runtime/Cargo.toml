[package]
name = "omg"
version = "0.2.0"
edition = "2021"
# std::sync::LazyLock (used for the builtin handle tables) landed in 1.80.
rust-version = "1.80"
include = [
  "src/**",
  "build.rs",
  "README.md",
  "LICENSE*",
  "Cargo.toml",
]

description = "The fully self-hosted OMG language runtime: lexer, parser, bytecode compiler, stack VM, REPL, and built-in functions, all in Rust."
license = "MIT"
authors = ["Chris Rowles <christopher.rowles@outlook.com>"]
repository = "https://github.com/sentrychris/omglang"
homepage = "https://github.com/sentrychris/omglang"
documentation = "https://docs.rs/omg_runtime"
readme = "README.md"
keywords = ["language", "vm", "bytecode", "interpreter", "educational"]
categories = ["compilers", "development-tools"]


# The runtime has no cross-platform dependencies. The only crates it
# pulls in are thin OS bindings, selected per target, for the handful of
# builtins that talk to the terminal directly (raw-mode keyboard input,
# pseudo-terminals, fork).

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Console",
] }
