<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The OMG playground has moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://versyx.digital/omglang/playground/">
<!--
  The playground used to live here, served by GitHub Pages from this
  folder. There is one playground now, on the site, and this page only
  forwards to it so that old links keep working. A shared program
  travels in the part of the address after "#" ("#code=..."), which the
  site's playground reads in the same way, so it is passed along.

  Nothing else belongs in web/. The files the playground loads are
  built by scripts/build-web.sh and copied into the site by
  scripts/update-site.sh (docs/toolchain.md, "The browser builds").
-->
<script>
  location.replace('https://versyx.digital/omglang/playground/' + location.hash);
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=https://versyx.digital/omglang/playground/">
</noscript>
</head>
<body>
<p>The OMG playground is now at
<a href="https://versyx.digital/omglang/playground/">versyx.digital/omglang/playground</a>.</p>
</body>
</html>
