name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every `run:` step uses bash, including on Windows (Git Bash ships on
# the hosted runners), so the same commands work on all three systems.
defaults:
  run:
    shell: bash

# Nothing here installs Rust or builds rust/: that runtime is frozen
# (see rust/README.md) and the toolchain no longer needs it. Nothing
# installs a C compiler either; the macOS job and the cross-checks use
# the one the hosted runners come with.

jobs:
  # omg's own source as one C file, written by the checked-in Linux
  # binary. This is how omg reaches a system its checked-in binaries do
  # not run on: the macOS job below compiles this file with `cc` to get
  # its first omg.
  seed-c:
    name: omg as C (seed for other systems)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write omg.c
        run: |
          bin/omg --emit-c src/omg.omg omg.c
          wc -c omg.c

      - name: Upload omg.c
        uses: actions/upload-artifact@v4
        with:
          name: omg-c
          path: omg.c
          retention-days: 3

  # The native toolchain, built and tested on all three systems. On
  # Linux and Windows it writes machine code itself (OMG -> bytecode ->
  # x86-64) and this is a *self-rebuild* from the binary checked into
  # bin/ (omg, omg.exe). On macOS neither can run and the back end does
  # not cover it, so the first omg there comes from the generated C
  # above, and from then on it rebuilds itself through C (OMG ->
  # bytecode -> C -> cc), which keeps that route tested end to end.
  # The suite also puts the conformance corpus and the examples through
  # `--build --target c` wherever a C compiler is installed.
  native:
    name: Native toolchain (${{ matrix.os }})
    needs: seed-c
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # bin/omg is committed so a fresh clone has a native
      # toolchain with nothing installed. Check that it was built
      # from src/ as it is in this commit (build.sh stamps
      # it with a hash of its sources) *before* the steps below
      # rebuild it and hide the answer. Linux only: the committed
      # binary is Linux x86-64.
      - name: Checked-in native binary is current
        if: runner.os == 'Linux'
        run: scripts/check-bin.sh 2>&1 | tee check-bin.log

      # The checked-in omg.exe is written on Linux. This is the
      # only place it meets a real Windows before the steps below
      # replace it: it has to run a program, and build one that runs.
      - name: Checked-in omg.exe works
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          {
            bin/omg.exe --version
            bin/omg.exe tests/smoke/regressions.omg > checked-in.out 2>&1 || true
            diff tests/smoke/regressions.expected checked-in.out
            bin/omg.exe --build tests/smoke/regressions.omg ./checked-in-aot
            ./checked-in-aot.exe > checked-in-aot.out 2>&1 || true
            diff tests/smoke/regressions.expected checked-in-aot.out
          } 2>&1 | tee check-bin.log

      - name: Download omg.c
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: omg-c
          path: seed

      # The whole bootstrap on a system with no omg yet: one C file,
      # one compiler command.
      - name: First omg from generated C
        if: runner.os == 'macOS'
        run: |
          set -o pipefail
          {
            cc -O3 -w seed/omg.c -o bin/omg -lm
            bin/omg --version
          } 2>&1 | tee native-build.log

      # Builds src/omg.omg (which imports the rest of the toolchain)
      # into bin/omg (omg.exe on Windows) with the omg that is already
      # there. This validates that the in-repo binary can rebuild
      # itself from the current OMG sources, the load-bearing
      # self-hosting invariant for the native pipeline.
      - name: Build native toolchain
        run: scripts/build.sh 2>&1 | tee -a native-build.log

      # A second pass. On macOS the first pass was built by the omg
      # that came from the Linux-written C and this one is the
      # toolchain compiling itself there; on Linux it must simply come
      # out the same again.
      - name: Self-rebuild native toolchain
        if: runner.os != 'Windows'
        run: scripts/build.sh 2>&1 | tee native-rebuild.log

      # On Windows the second pass goes through build.ps1, the same
      # build for people who work in PowerShell, so that both scripts
      # are exercised.
      - name: Self-rebuild native toolchain (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 *>&1 | Tee-Object -FilePath native-rebuild.log

      # tests/run.sh is the comprehensive end-to-end suite. It exercises
      # bin/omg directly:
      #   * builtins   — process & I/O builtins, interpreted and built
      #   * driver     — every omg invocation form (interpret / --build
      #                  and its targets / --compile / --emit-c /
      #                  --emit-js / --disasm / REPL)
      #   * repl       — REPL state, multi-line input, error recovery
      #   * syntax     — malformed programs fail with a clean SyntaxError
      #   * regression — specific bugs we've fixed, each through every
      #                  applicable backend
      #   * conformance — the corpus in tests/conformance/ on the
      #                  interpreter, built executables (machine code
      #                  and through C) and `omg --emit-js`
      #   * tools      — the programs in tools/, and the HTTP server
      #                  answering requests
      #   * db         — the database in tools/db
      #   * video      — the H.264 decoder in tools/video against
      #                  checksums from ffmpeg; a window opened,
      #                  drawn in and closed, and the player run
      #                  (Linux: on Xvfb; Windows: on the desktop)
      #   * parity     — the compiler gives the same bytes as machine
      #                  code and on the OMG VM; every example prints
      #                  the same interpreted, built, through C and as
      #                  JavaScript; the toolchain rebuilds itself and
      #                  writes the same binary again
      - name: Run end-to-end test suite
        run: tests/run.sh 2>&1 | tee tests.log

      # The cross-backend regression program, interpreted by the
      # native driver and built to an executable.
      - name: Regression program (native interpreter and AOT)
        run: |
          set -o pipefail
          OMG=bin/omg
          if [ "$RUNNER_OS" = Windows ]; then OMG=bin/omg.exe; fi
          {
            "$OMG" tests/smoke/regressions.omg > native.out 2>&1 || true
            diff tests/smoke/regressions.expected native.out
            "$OMG" --build tests/smoke/regressions.omg ./regressions-aot
            ./regressions-aot > aot.out 2>&1 || true
            diff tests/smoke/regressions.expected aot.out
          } 2>&1 | tee regressions.log

      # The checked-in browser bundle (compiler + VM + both transpilers,
      # transpiled to JS) must still drive every explorer stage.
      - name: Web explorer bundle
        run: node web/test-explorer.mjs 2>&1 | tee explorer.log

      # web/ holds generated bundles (the compiler and VM transpiled to
      # JS). The build is deterministic, so a rebuild that changes
      # anything means they were not regenerated after a change to
      # their sources.
      - name: Checked-in web bundles are current
        if: runner.os == 'Linux'
        run: |
          scripts/build-web.sh 2>&1 | tee web-build.log
          git diff --stat --exit-code -- web || {
            echo "::error title=web bundles are stale::Run scripts/build-web.sh and commit web/"
            exit 1
          }

      - name: Summarise failure
        if: failure()
        run: |
          for f in check-bin.log native-build.log native-rebuild.log tests.log regressions.log explorer.log web-build.log; do
            [ -f "$f" ] || continue
            {
              echo "### ${{ matrix.os }}: tail of $f"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # Annotate with the tail of the *last* log written — the step
          # that failed.
          last=$(ls -t native-build.log native-rebuild.log tests.log regressions.log explorer.log 2>/dev/null | head -n 1 || true)
          if [ -n "$last" ]; then
            msg=$(tail -n 60 "$last" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${{ matrix.os }} $last::$msg"
          fi

  # The point of the x86-64 back end: on Linux and Windows the
  # toolchain needs nothing else. These two jobs run where there is no
  # C compiler and no Rust: the checked-in binary rebuilds itself, the
  # rebuild is byte-identical when repeated, and the conformance corpus
  # passes interpreted and built to machine code.
  standalone-linux:
    name: Standalone (Linux, nothing installed)
    runs-on: ubuntu-latest
    # A bare image: no gcc, no cargo, no node, not even git.
    container: ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild and test with nothing but omg
        run: OMG_STANDALONE_STRICT=1 tests/standalone.sh 2>&1 | tee standalone.log

      - name: Summarise failure
        if: failure()
        run: |
          {
            echo "### standalone (Linux): tail of standalone.log"
            echo '```'
            tail -n 60 standalone.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  standalone-windows:
    name: Standalone (Windows, nothing on PATH)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The hosted runner has compilers installed; a PATH of only Git
      # Bash's own tools takes them out of reach.
      - name: Rebuild and test with nothing but omg
        run: |
          export PATH="/usr/bin:/bin"
          OMG_STANDALONE_STRICT=1 tests/standalone.sh 2>&1 | tee standalone.log

      - name: Summarise failure
        if: failure()
        run: |
          {
            echo "### standalone (Windows): tail of standalone.log"
            echo '```'
            tail -n 60 standalone.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The VS Code extension in vscode/. Its language server follows the
  # compiler by hand (a port of the lexer and parser, the builtin list,
  # the scope rules), so its tests hold it to the checked-in omg: same
  # builtins, same first syntax error on broken files, and every
  # documented example prints what it says. They also run the checks
  # over every .omg file in the repository, which must come out clean.
  # The packaged extension is kept with the run.
  editor:
    name: VS Code extension
    runs-on: ubuntu-latest
    # It only reads the repository; the artifact upload does not go
    # through this token.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: Install
        working-directory: vscode
        run: npm ci

      - name: Test
        working-directory: vscode
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log

      - name: Package
        working-directory: vscode
        run: npm run package

      - name: Upload the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: omg-language-support
          path: vscode/omg-language-support.vsix

      - name: Summarise failure
        if: failure()
        run: |
          {
            echo "### VS Code extension: failing tests"
            echo '```'
            grep -A 25 '^not ok' vscode/test.log | head -n 120 || tail -n 60 vscode/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
