name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Every `run:` step uses bash, including on Windows (Git Bash ships on
# the hosted runners), so the same commands work on all three systems.
defaults:
  run:
    shell: bash

jobs:
  # The Rust runtime is the reference implementation, and the seed
  # that bootstraps the native toolchain on any host the checked-in
  # binaries don't run on.
  rust:
    name: Rust runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # Building also runs `rust/build.rs`, which bootstraps
      # `src/compiler.omgb` from `src/compiler.omg`
      # using the Rust frontend. If the bootstrap is broken, the build
      # fails here.
      - name: Build (release)
        run: cargo build --release --manifest-path rust/Cargo.toml 2>&1 | tee build.log

      - name: Run unit tests
        run: cargo test --manifest-path rust/Cargo.toml 2>&1 | tee test.log

      # Portable end-to-end check (no C compiler needed):
      #   * self-hosting fixed point: the OMG-in-OMG compiler (running on
      #     the VM) produces byte-identical output to the Rust frontend
      #     when compiling its own source
      #   * triple-meta fixed point: the same, with the OMG compiler
      #     running on the OMG-written VM (src/vm.omg)
      #   * both frontends agree on every .omg file in the repo
      #   * every example prints the same thing through both frontends
      #   * a regression program prints the expected output on the Rust
      #     VM, the OMG-written VM, and the JS transpiler (via node)
      #   * the conformance corpus (tests/conformance/) behaves the
      #     same on those same backends
      #   * malformed programs fail with a SyntaxError, never a crash
      - name: Smoke test
        run: tests/smoke.sh 2>&1 | tee smoke.log

      # The checked-in browser bundle (compiler + VM + both transpilers,
      # transpiled to JS) must still drive every explorer stage.
      - name: Web explorer bundle
        run: node web/test-explorer.mjs 2>&1 | tee explorer.log

      # Put the tail of whichever step failed on the run summary, so a
      # red matrix cell explains itself without opening the full log.
      - name: Summarise failure
        if: failure()
        run: |
          for f in build.log test.log smoke.log explorer.log; do
            [ -f "$f" ] || continue
            {
              echo "### ${{ matrix.os }}: tail of $f"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(tail -n 25 "$f" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${{ matrix.os }} $f::$msg"
          done

  # Guards the `rust-version` promise in rust/Cargo.toml.
  msrv:
    name: Rust runtime (MSRV 1.80)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust 1.80
        uses: dtolnay/rust-toolchain@1.80.0

      - name: Build
        run: cargo build --manifest-path rust/Cargo.toml 2>&1 | tee build.log

      - name: Summarise failure
        if: failure()
        run: |
          msg=$(tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=MSRV build::$msg"

  # The native toolchain (OMG -> bytecode -> C -> machine code) needs
  # only a C compiler, and is built and tested on all three systems.
  # On Linux and Windows this is a *self-rebuild* from the binary
  # checked into bin/ (omg, omg.exe); on macOS neither can
  # run, so build.sh bootstraps from the Rust runtime instead. The
  # Windows runner's C compiler is the MinGW-w64 GCC on its PATH.
  native:
    name: Native toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      # The Rust runtime is the bootstrap seed for build.rs (which
      # produces `src/{compiler,vm}.omgb`) and the reference
      # implementation the test suite compares the native `omg`
      # against.
      - name: Build Rust runtime (bootstrap seed)
        run: cargo build --release --manifest-path rust/Cargo.toml 2>&1 | tee build.log

      # bin/omg is committed so a fresh clone has a native
      # toolchain without the Rust runtime. Check that it was built
      # from src/ as it is in this commit (build.sh stamps
      # it with a hash of its sources) *before* the steps below
      # rebuild it and hide the answer. Linux only: the committed
      # binary is Linux x86-64.
      - name: Checked-in native binary is current
        if: runner.os == 'Linux'
        run: scripts/check-bin.sh 2>&1 | tee check-bin.log

      # The checked-in omg.exe is cross-compiled on Linux. This is the
      # only place it meets a real Windows before the steps below
      # replace it: it has to run a program, and build one that runs.
      - name: Checked-in omg.exe works
        if: runner.os == 'Windows'
        run: |
          set -o pipefail
          {
            gcc --version | head -n 1
            bin/omg.exe --version
            bin/omg.exe tests/smoke/regressions.omg > checked-in.out 2>&1 || true
            diff tests/smoke/regressions.expected checked-in.out
            bin/omg.exe --build tests/smoke/regressions.omg ./checked-in-aot
            ./checked-in-aot.exe > checked-in-aot.out 2>&1 || true
            diff tests/smoke/regressions.expected checked-in-aot.out
          } 2>&1 | tee check-bin.log

      # Compiles src/omg.omg (which imports the rest of the
      # toolchain) → bin/omg (omg.exe on Windows). On Linux
      # and Windows this validates that the in-repo binary can rebuild
      # itself from the current OMG sources, the load-bearing
      # self-hosting invariant for the native pipeline.
      - name: Build native toolchain
        run: scripts/build.sh 2>&1 | tee native-build.log

      # A second pass always self-rebuilds: the binary from the first
      # pass was produced by an older compiler (Linux, Windows) or by
      # the Rust runtime (macOS); this one is the toolchain compiling
      # itself.
      - name: Self-rebuild native toolchain
        if: runner.os != 'Windows'
        run: scripts/build.sh 2>&1 | tee native-rebuild.log

      # On Windows the second pass goes through build.ps1, the same
      # build for people who work in PowerShell, so that both scripts
      # are exercised.
      - name: Self-rebuild native toolchain (PowerShell)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 *>&1 | Tee-Object -FilePath native-rebuild.log

      # tests/run.sh is the comprehensive end-to-end suite. It exercises
      # bin/omg directly:
      #   * builtins   — process & I/O builtins via Rust + native AOT
      #   * driver     — every omg invocation form (interpret / --build
      #                  / --compile / --emit-c / --emit-js / --disasm
      #                  / REPL)
      #   * repl       — REPL state, multi-line input, error recovery
      #   * regression — specific bugs we've fixed, each through every
      #                  applicable backend
      #   * conformance — the corpus in tests/conformance/ on the
      #                  native interpreter, AOT and `omg --emit-js`
      #                  (the smoke test runs it on the portable
      #                  backends)
      #   * parity     — triple-meta fixed-point + byte-identical
      #                  bytecode (Rust frontend vs native omg) + AOT
      #                  corpus parity (Rust runtime vs `omg --build`
      #                  vs `omg <file.omg>`) + native self-rebuild,
      #                  after which omg must write the same C for
      #                  itself as it did before
      - name: Run end-to-end test suite
        run: tests/run.sh 2>&1 | tee tests.log

      # The cross-backend regression program, through the two native
      # paths the smoke test can't reach: interpreted by the native
      # driver, and AOT-compiled to machine code.
      - name: Regression program (native interpreter and AOT)
        run: |
          set -o pipefail
          OMG=bin/omg
          if [ "$RUNNER_OS" = Windows ]; then OMG=bin/omg.exe; fi
          {
            "$OMG" tests/smoke/regressions.omg > native.out 2>&1 || true
            diff tests/smoke/regressions.expected native.out
            "$OMG" --build tests/smoke/regressions.omg ./regressions-aot
            ./regressions-aot > aot.out 2>&1 || true
            diff tests/smoke/regressions.expected aot.out
          } 2>&1 | tee regressions.log

      # web/ holds generated bundles (the compiler and VM transpiled to
      # JS, plus copies of a few examples). The build is deterministic, so a
      # rebuild that changes anything means they were not regenerated
      # after a change to their sources.
      - name: Checked-in web bundles are current
        if: runner.os == 'Linux'
        run: |
          scripts/build-web.sh 2>&1 | tee web-build.log
          git diff --stat --exit-code -- web || {
            echo "::error title=web bundles are stale::Run scripts/build-web.sh and commit web/"
            exit 1
          }

      - name: Summarise failure
        if: failure()
        run: |
          for f in build.log check-bin.log native-build.log native-rebuild.log tests.log regressions.log web-build.log; do
            [ -f "$f" ] || continue
            {
              echo "### ${{ matrix.os }}: tail of $f"
              echo '```'
              tail -n 60 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          # Annotate with the tail of the *last* log written — the step
          # that failed.
          last=$(ls -t build.log native-build.log native-rebuild.log tests.log regressions.log 2>/dev/null | head -n 1 || true)
          if [ -n "$last" ]; then
            msg=$(tail -n 60 "$last" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=${{ matrix.os }} $last::$msg"
          fi
